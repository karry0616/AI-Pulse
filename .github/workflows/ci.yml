name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 只装测试真正 import 到的依赖，跳过 streamlit / chromadb 等重包
      - name: Install test dependencies
        run: pip install pandas requests feedparser pytest

      - name: Run tests
        run: python -m pytest -q
